name: Build & Test

on: [push]

permissions:
  packages: write
  contents: read

jobs:
  build_tag:
    if: startsWith(github.event.ref, 'refs/tags/')
  
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v4.2.1
        with:
          push: true
          tags: ghcr.io/dysnomia-studio/galactae-cdn:${{github.ref_name}}
  
  build_branch:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v4.2.1
        with:
          push: true
          tags: ghcr.io/dysnomia-studio/galactae-cdn:${{ github.head_ref || github.ref_name }} 
